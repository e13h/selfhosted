services:
  navidrome:
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    restart: unless-stopped
    container_name: navidrome
    volumes:
      - "{{ appdata_path }}/apps/navidrome:/data"
      - "{{ storage_path }}/music:/music:ro"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "navidrome"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:4533/http"
      tsdproxy.dash.category: "Media"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true
