plugins:
  [
    chroma,
    # convert,
    embedart,
    fetchart,
    mbsync,
    musicbrainz,
    replaygain,
    scrub,
    web,
    webimport,
  ]
directory: /music
library: /config/library.db
art_filename: albumart
threaded: yes
original_date: no
per_disc_numbering: no
asciify_paths: yes

# convert:
#   auto: no
#   ffmpeg: /usr/bin/ffmpeg
#   opts: -ab 320k -ac 2 -ar 48000
#   max_bitrate: 320
#   threads: 1

paths:
  default: $navidrome_library/$albumartist/$album%aunique{}/$track $title
  singleton: $navidrome_library/Non-Album/$artist/$title
  comp: $navidrome_library/Compilations/$album%aunique{}/$track $title

match:
  distance_weights:
    # Mostly partial albums (a few tracks bought from an album): keep them
    # matched to the full release without the default 0.9 weight pushing
    # every partial match to ~0.5. Measured: correct release 0.49 -> 0.17
    # for one track of 11; a wrong album stays at ~0.39.
    missing_tracks: 0.1

musicbrainz:
  external_ids:
    discogs: yes
    bandcamp: yes
    spotify: yes
    deezer: yes
    beatport: yes
    tidal: yes
  search_limit: 2
  extra_tags: [alias, barcode, country, label, media, tracks, year]
  genres: yes

import:
  write: yes
  copy: no
  move: yes # webimport keeps each file's original bytes; Undo import restores them
  resume: ask
  incremental: no # yes silently skips re-imports after an undo; revisit with smarter caching
  quiet_fallback: skip
  detail: yes
  timid: no
  duplicate_action: ask
  log: /config/beet.log
  set_fields:
    navidrome_library: unassigned

chroma:
  auto: no # don't fingerprint on import (~9s/album); `beet fingerprint` still works manually

embedart:
  auto: yes
  ifempty: no
  remove_art_file: yes

fetchart:
  # Import-time art is chosen in webimport's review and set by webimport
  # (embedart then embeds it). `beet fetchart` still works for manual use.
  auto: no
  minwidth: 0
  enforce_ratio: no
  sources:
    - filesystem
    - coverart: release
    - coverart: releasegroup

replaygain:
  auto: no
  command: mp3gain

scrub:
  auto: no # keep tags beets does not manage (iTunes IDs, gapless iTunSMPB, Sound Check, rtng); `beet scrub` still works manually

replace:
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '[\xE8-\xEB]': e
  '[\xEC-\xEF]': i
  '[\xE2-\xE6]': a
  '[\xF2-\xF6]': o
  '[\xF8]': o
  '\.$': _
  '\s+$': ""

ui:
  color: yes

web:
  host: 0.0.0.0
  port: 8337

webimport:
  host: 0.0.0.0
  port: 8338
  inbox_dir: /downloads
  navidrome:
    url: "https://navidrome.{{ vault_tailscale_magicdns_domain }}"
    user: webimport
    password: "{{ vault_navidrome_bot_password }}"
