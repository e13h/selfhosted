services:
  onelineaday:
    image: ghcr.io/e13h/onelineaday:2.0
    container_name: onelineaday
    ports:
      - "3800:3000"
    volumes:
      - onelineaday-data:/app/db
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - tsdproxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "onelineaday"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:3000/http"
      tsdproxy.dash.category: "Journal"
      tsdproxy.dash.icon: "mdi/notebook"
    restart: unless-stopped
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  onelineaday-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/onelineaday"
