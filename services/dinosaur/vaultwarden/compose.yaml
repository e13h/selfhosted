services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: "https://vaultwarden.{{ vault_tailscale_magicdns_domain }}"
      SIGNUPS_ALLOWED: true
      SSO_ENABLED: true
      SSO_ONLY: true
      SIGNUPS_VERIFY: false
      SSO_SIGNUPS_MATCH_EMAIL: true
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: true
      SSO_PKCE: true
      SSO_SCOPES: email profile groups offline_access
      SSO_AUTHORITY: "https://pocket-id.{{ vault_tailscale_magicdns_domain }}"
      SSO_CLIENT_ID: "{{ vault_vaultwarden_sso_client_id }}"
      SSO_CLIENT_SECRET: "{{ vault_vaultwarden_sso_client_secret }}"
    ports:
      - 2708:80
    volumes:
      - vaultwarden-data:/data/
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "vaultwarden"
      tsdproxy.ephemeral: "true"
      tsdproxy.port.1: "443/https:80/http"
      tsdproxy.dash.category: "Productivity"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  vaultwarden-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/vaultwarden"
