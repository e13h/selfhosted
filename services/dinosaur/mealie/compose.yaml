services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.10.2
    container_name: mealie
    user: "0:0"
    restart: unless-stopped
    ports:
        - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      ALLOW_SIGNUP: false
      PUID: "{{ ansible_user_uid }}"
      PGID: "{{ ansible_user_gid }}"
      TZ: "{{ timezone }}"
      OIDC_AUTH_ENABLED: true
      ALLOW_PASSWORD_LOGIN: false
      OIDC_CONFIGURATION_URL: "https://pocket-id.{{ vault_tailscale_magicdns_domain }}/.well-known/openid-configuration"
      OIDC_CLIENT_ID: "{{ vault_mealie_oidc_client_id }}"
      OIDC_CLIENT_SECRET: "{{ vault_mealie_oidc_client_secret }}"
      OIDC_PROVIDER_NAME: "Pocket ID"
      BASE_URL: "https://mealie.{{ vault_tailscale_magicdns_domain }}"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "mealie"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:9000/http"
      tsdproxy.dash.category: "Cooking"

volumes:
  mealie-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/mealie"
