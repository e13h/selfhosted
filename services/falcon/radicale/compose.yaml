services:
  radicale:
    image: ghcr.io/kozea/radicale:stable
    container_name: radicale
    ports:
      - 5232:5232
    user: "0:0"
    volumes:
      - radicale-config:/etc/radicale
      - radicale-data:/var/lib/radicale
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "radicale"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:5232/http"
      tsdproxy.dash.category: "Productivity"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  radicale-config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/radicale/config"
  radicale-data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/radicale/data"
