services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v1
    restart: unless-stopped
    container_name: pocket-id
    ports:
      - 1411:1411
    volumes:
      - pocket-id-data:/app/data
    environment:
      APP_URL: "https://pocket-id.{{ vault_tailscale_magicdns_domain }}"
      TRUST_PROXY: "false"
      MAXMIND_LICENSE_KEY: "{{ vault_maxmind_license_key }}"
      PUID: "{{ ansible_facts['user_uid'] }}"
      PGID: "{{ ansible_facts['user_gid'] }}"
      ENCRYPTION_KEY: "{{ vault_pocket_id_encryption_key }}"
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "pocket-id"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:1411/http"
      tsdproxy.dash.category: "Infrastructure"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  pocket-id-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/pocket-id"
