services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "13378:80"
    volumes:
      - audiobookshelf-audiobooks:/audiobooks:ro
      - audiobookshelf-podcasts:/podcasts
      - audiobookshelf-config:/config
      - audiobookshelf-metadata:/metadata
    environment:
      - TZ="{{ timezone }}"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "audiobookshelf"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:80/http"
      tsdproxy.dash.category: "Media"
    restart: unless-stopped
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  audiobookshelf-audiobooks:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/audiobooks"
  audiobookshelf-podcasts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/podcasts"
  audiobookshelf-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/audiobookshelf/config"
  audiobookshelf-metadata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/audiobookshelf/metadata"
