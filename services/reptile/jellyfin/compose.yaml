services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - jellyfin-movies:/movies:ro
      - jellyfin-youtube:/youtube:ro
    restart: unless-stopped
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "jellyfin"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:8096/http"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  jellyfin-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/jellyfin/config"
  jellyfin-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/jellyfin/cache"
  jellyfin-movies:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/movies"
  jellyfin-youtube:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/youtube"
