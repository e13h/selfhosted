services:
  fizzy:
    image: ghcr.io/basecamp/fizzy:main
    container_name: fizzy
    volumes:
      - fizzy-data:/rails/storage
    environment:
      SECRET_KEY_BASE: "{{ vault_fizzy_secret_key_base }}"
      BASE_URL: "https://fizzy.{{ vault_tailscale_magicdns_domain }}"
      VAPID_PRIVATE_KEY: "{{ vault_fizzy_vapid_private_key }}"
      VAPID_PUBLIC_KEY: "{{ vault_fizzy_vapid_public_key }}"
    ports:
      - "8180:80"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "fizzy"
      tsdproxy.ephemeral: "true"
      tsdproxy.port.1: "443/https:80/http"
      tsdproxy.dash.category: "Productivity"
      tsdproxy.dash.icon: "mdi/developer-board"
    restart: unless-stopped
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  fizzy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/fizzy"
