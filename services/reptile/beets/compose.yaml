services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    volumes:
      - beets-config:/config
      - beets-library:/music
      - beets-ingest:/downloads
      - beets-custom-cont-init.d:/custom-cont-init.d:ro
      - beets-custom-services.d:/custom-services.d:ro
    environment:
      PUID: "0"  # rootless docker: container root == host user
      PGID: "0"
      TZ: "{{ timezone }}"
    ports:
      - 8337:8337
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "beets"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:8337/http"
      tsdproxy.port.2: "8338/https:8338/http"
      tsdproxy.dash.category: "Music"
      tsdproxy.dash.icon: "sh/beets"
    restart: unless-stopped
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  beets-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/config"
  beets-library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/music"
  beets-ingest:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/ingest"
  beets-custom-cont-init.d:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/custom-cont-init.d"
  beets-custom-services.d:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/custom-services.d"
