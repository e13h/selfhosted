services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    volumes:
      - beets-config:/config
      - beets-library:/music
      - beets-ingest:/downloads
    environment:
      PUID: "{{ ansible_facts['user_uid'] }}"
      PGID: "{{ ansible_facts['user_gid'] }}"
      TZ: "{{ timezone }}"
    ports:
      - 8337:8337
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "beets"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:8337/http"
      tsdproxy.dash.category: "Music"
      tsdproxy.dash.icon: "sh/beets"
    restart: unless-stopped
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  beets-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/config"
  beets-library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/music"
  beets-ingest:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/beets/ingest"
