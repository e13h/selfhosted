defaultProxyProvider: default
docker:
  local:
    host: unix:///var/run/docker.sock
    targetHostname: host.docker.internal
    defaultProxyProvider: default
    tryDockerInternalNetwork: true
lists: {}
tailscale:
  providers:
    default:
      clientId: "{{ tailscale_oauth_client_id }}"
      clientSecret: "{{ tailscale_oauth_client_secret }}"
      tags: "tag:container"
      controlUrl: https://controlplane.tailscale.com
  dataDir: /data/
http:
  hostname: 127.0.0.1
  port: 8080
log:
  level: info
  json: false
proxyAccessLog: true
