services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - metube-config:/config
      - metube-downloads:/downloads
    environment:
      STATE_DIR: /config
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "metube"
      tsdproxy.ephemeral: "false"
      tsdproxy.port.1: "443/https:8081/http"
    networks:
      - tsdproxy
    depends_on:
      tsdproxy:
        condition: service_healthy
        restart: true

volumes:
  metube-downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ storage_path }}/youtube"
  metube-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "{{ appdata_path }}/apps/metube"
