---
services:
  actual_server:
    image: ghcr.io/e13h/actual-server:edge-alpine
    container_name: actual-budget
    ports:
      - '5006:5006'
    volumes:
      - ./actual-data:/data
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "actual"
      tsdproxy.ephemeral: "false"
    networks:
      - tsdproxy
    restart: unless-stopped

networks:
  tsdproxy:
    external: true
