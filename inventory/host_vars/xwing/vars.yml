ansible_become_password: "{{ vault_become_password_xwing }}"

samba_shares:
  - name: data
    path: /data
    comment: "{{ inventory_hostname }} /data share"
    valid_users:
      - "{{ samba_default_user }}"
    read_only: false
    guest_ok: false
    create_mask: "0664"
    directory_mask: "0775"
    owner: "{{ samba_default_user }}"
    group: "{{ samba_default_group | default(samba_default_user) }}"
  - name: beets-inbox
    path: "{{ appdata_path }}/apps/beets/ingest"
    comment: "beets-flask inbox"
    valid_users:
      - "{{ samba_default_user }}"
    read_only: false
    guest_ok: false
    create_mask: "0664"
    directory_mask: "0775"
    owner: "{{ samba_default_user }}"
    group: "{{ samba_default_group | default(samba_default_user) }}"

borgmatic_cron_hour: "3"
borgmatic_cron_minute: "35"
borgmatic_exclude_patterns:
  - "{{ appdata_path }}/apps/navidrome/cache"    # transcode/image cache
  - "{{ appdata_path }}/apps/beets/ingest"       # music inbox (media)
  - "{{ appdata_path }}/apps/beets-flask/inbox"  # old beets-flask music inbox (media)
borgmatic_sqlite_databases:
  - name: audiobookshelf
    path: "{{ appdata_path }}/apps/audiobookshelf/config/absdatabase.sqlite"
  - name: fizzy
    path: "{{ appdata_path }}/apps/fizzy/production.sqlite3"
  - name: navidrome
    path: "{{ appdata_path }}/apps/navidrome/navidrome.db"
  - name: jellyfin
    path: "{{ appdata_path }}/apps/jellyfin/config/data/jellyfin.db"
  - name: pinchflat
    path: "{{ appdata_path }}/apps/pinchflat/db/pinchflat.db"
  - name: beets
    path: "{{ appdata_path }}/apps/beets/config/library.db"
