services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.10.2
    container_name: mealie
    restart: unless-stopped
    ports:
        - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      ALLOW_SIGNUP: false
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
      OIDC_AUTH_ENABLED: true
      ALLOW_PASSWORD_LOGIN: false
    env_file:
      - .env
    networks:
      - tsdproxy
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "mealie"
      tsdproxy.ephemeral: "false"

volumes:
  mealie-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

networks:
  tsdproxy:
    external: true
