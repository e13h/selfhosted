# Add Tailscale apt repository
- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# Check current Tailscale status
- name: Get Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_is_running: "{{ (tailscale_status.stdout | from_json).BackendState == 'Running' }}"
    tailscale_current_tags: "{{ (tailscale_status.stdout | from_json).Self.Tags | default([]) }}"
  when: tailscale_status.stdout != ""

# Authenticate if not already connected
- name: Authenticate with Tailscale
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--auth-key=' + tailscale_oauth_client_secret, '--ssh', '--accept-dns'] + (['--advertise-tags=' + tailscale_advertise_tags | join(',')] if tailscale_advertise_tags | length > 0 else []) }}"
  when:
    - tailscale_oauth_client_secret is defined
    - not tailscale_is_running | default(false)
  register: tailscale_up
  changed_when: tailscale_up.rc == 0

# Check if already-running node is missing any desired tags
- name: Check for missing Tailscale tags
  ansible.builtin.set_fact:
    tailscale_tags_missing: "{{ tailscale_advertise_tags | difference(tailscale_current_tags | default([])) | length > 0 }}"
  when: tailscale_is_running | default(false)

# Re-authenticate if tags are missing (tailscale set does not support --advertise-tags)
- name: Re-authenticate Tailscale to apply missing tags
  when:
    - tailscale_is_running | default(false)
    - tailscale_tags_missing | default(false)
  block:
    - name: Disconnect Tailscale
      ansible.builtin.command: tailscale down
      changed_when: true

    - name: Re-connect Tailscale with correct tags
      ansible.builtin.command:
        argv: "{{ ['tailscale', 'up', '--auth-key=' + tailscale_oauth_client_secret, '--ssh', '--accept-dns'] + (['--advertise-tags=' + tailscale_advertise_tags | join(',')] if tailscale_advertise_tags | length > 0 else []) }}"
      when: tailscale_oauth_client_secret is defined
      changed_when: true

# Configure settings on already-running node using `tailscale set`
# which only updates specified flags without touching others
- name: Configure Tailscale settings
  ansible.builtin.command: >
    tailscale set
    --ssh
    --accept-dns
    --auto-update
  when: tailscale_is_running | default(false)
  changed_when: false
