---
# roles/samba_share/tasks/main.yml

- name: Install Samba packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure shared directories exist with correct ownership/perms
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "0775"
  loop: "{{ samba_shares }}"
  become: true

- name: Deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  become: true
  notify:
    - restart samba
    - restart nmbd

- name: Read password sentinel for each Samba user
  ansible.builtin.slurp:
    src: "/etc/samba/.smbpw_{{ item.name }}"
  loop: "{{ samba_users }}"
  register: samba_sentinels
  failed_when: false
  become: true
  no_log: true

- name: Set Samba passwords (add or update when changed)
  ansible.builtin.shell: |
    printf '%s\n%s\n' "{{ item.item.password }}" "{{ item.item.password }}" | smbpasswd -s -a "{{ item.item.name }}"
    (umask 177 && printf '%s' "{{ (item.item.name + ':' + item.item.password) | hash('sha256') }}" \
      > /etc/samba/.smbpw_{{ item.item.name }})
  loop: "{{ samba_sentinels.results }}"
  when: >
    item.failed or
    (item.content | default('') | b64decode) != ((item.item.name + ':' + item.item.password) | hash('sha256'))
  become: true
  no_log: true

- name: Enable the Samba user (in case it was previously disabled)
  ansible.builtin.command: "smbpasswd -e {{ item.name }}"
  loop: "{{ samba_users }}"
  changed_when: false
  become: true

- name: Allow Samba through ufw (if managed and ufw is present)
  community.general.ufw:
    rule: allow
    name: Samba
    from_ip: "{{ item }}"
  loop: "{{ samba_firewall_allowed_sources if samba_firewall_allowed_sources | length > 0 else ['any'] }}"
  when: samba_manage_firewall
  become: true
  failed_when: false  # no-op cleanly if ufw isn't installed

- name: Ensure Samba service is enabled and running
  ansible.builtin.systemd:
    name: "{{ samba_service_name }}"
    enabled: true
    state: started
  become: true

- name: Ensure nmbd service is enabled and running
  ansible.builtin.systemd:
    name: "{{ samba_nmbd_service_name }}"
    enabled: true
    state: started
  when: samba_manage_nmbd
  become: true
