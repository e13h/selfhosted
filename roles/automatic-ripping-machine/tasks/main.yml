- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - arm_share_mountpoint is defined
      - arm_samba_user is defined
    fail_msg: "arm_share_mountpoint and arm_samba_user must be set for this role"

- name: Ensure lsscsi is installed
  ansible.builtin.apt:
    name: lsscsi
    state: present
    update_cache: true

- name: Add ansible_user to cdrom and video groups
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: cdrom,video
    append: true

- name: Find optical drive devices
  ansible.builtin.find:
    paths: /dev
    patterns: 'sr[0-9]*'
    file_type: any
    depth: 1
  register: optical_devices

- name: Ensure /mnt/dev directory exists
  ansible.builtin.file:
    path: /mnt/dev
    state: directory
    mode: "0755"

- name: Find existing mount point directories
  ansible.builtin.find:
    paths: /mnt/dev
    file_type: directory
    patterns: 'sr[0-9]*'
  register: existing_mountpoints
  ignore_errors: true

# Path scheme: /dev/sr0 -> /mnt/dev/sr0
- name: Create mount points for connected drives
  ansible.builtin.file:
    path: "/mnt{{ item.path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop: "{{ optical_devices.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove mount points for disconnected drives
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ existing_mountpoints.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename not in (optical_devices.files | map(attribute='path') | map('basename') | list)

- name: Install cifs-utils
  ansible.builtin.apt:
    name: cifs-utils
    state: present
    update_cache: true

- name: Ensure Samba credentials directory exists
  ansible.builtin.file:
    path: /etc/samba/creds
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create Samba xwing credentials file
  ansible.builtin.copy:
    dest: /etc/samba/creds/xwing-data
    content: |
      username={{ arm_samba_user }}
      password={{ vault_samba_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create ARM share mount point
  ansible.builtin.file:
    path: "{{ arm_share_mountpoint }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"

- name: Get uid for rootless docker user
  ansible.builtin.getent:
    database: passwd
    key: "{{ rootless_docker_user }}"
  become: true

- name: Mount xwing /beets-inbox share via CIFS
  ansible.posix.mount:
    path: "{{ arm_share_mountpoint }}"
    src: "//xwing.{{ vault_tailscale_magicdns_domain }}/beets-inbox"
    fstype: cifs
    opts: "credentials=/etc/samba/creds/xwing-data,uid={{ ansible_facts.getent_passwd[rootless_docker_user][1] }},gid={{ ansible_facts.getent_passwd[rootless_docker_user][2] }},iocharset=utf8,vers=3.0,nobrl,_netdev"
    state: mounted

- name: Create ARM udev rule for optical disc detection
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/51-arm-cdrom.rules
    content: |
      # ID_CDROM_MEDIA_BD = Bluray
      # ID_CDROM_MEDIA_DVD = DVD
      # ID_CDROM_MEDIA_CD = CD
      KERNEL=="sr[0-9]", ACTION=="change", SUBSYSTEM=="block", ENV{ID_CDROM_MEDIA_STATE}!="blank", RUN+="/usr/bin/env DOCKER_HOST=unix:///run/user/{{ ansible_facts.getent_passwd[rootless_docker_user][1] }}/docker.sock /usr/bin/docker exec arm-rippers sh -c 'udevadm test /sys/class/block/%k >/dev/null 2>&1; /opt/arm/scripts/docker/docker_arm_wrapper.sh %k'"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload udev rules
